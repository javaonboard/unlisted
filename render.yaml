services:
  - type: web
    name: unlisted
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TZ
        value: America/Chicago
      - key: AI_DAILY_LIMIT # Claude calls per day for the public demo
        value: "1000"
      - key: DATABASE_URL
        fromDatabase:
          name: unlisted-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false

databases:
  - name: unlisted-db
    plan: 0.1c-256mb
    region: oregon
